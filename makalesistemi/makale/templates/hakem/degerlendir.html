{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h1 class="mb-4 text-primary">📄 {{ makale.takip_numarasi }} - Makale Değerlendirme</h1>

        <p><strong>Hakem:</strong> {{ hakem.isim }}</p>
        <p><strong>Makale Başlığı:</strong> <span class="text-secondary">{{ makale.takip_numarasi }}</span></p>

        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="id_yorum">Değerlendirme Yorumunuz:</label>
                {{ form.yorum }}
            </div>
            
            <button type="submit" class="btn btn-success">📬 Değerlendirmeyi Gönder</button>
            <a href="{% url 'hakem_panel_by_id' hakem.id %}" class="btn btn-outline-primary ms-3">↩️ Paneline Dön</a>
        </form>
    </div>
</div>
{% endblock %}
